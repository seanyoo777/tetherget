<!-- 결제방법 선택 버튼 -->
<div class="quick-pay-wrap">
  <div class="quick-title">결제방법</div>

  <div class="quick-pay-grid">
    <button class="pay-chip active" onclick="selectPay(this,'은행이체')">
      🏦 은행이체
    </button>

    <button class="pay-chip" onclick="selectPay(this,'MoMo')">
      📱 MoMo
    </button>

    <button class="pay-chip" onclick="selectPay(this,'현금')">
      💵 현금
    </button>

    <button class="pay-chip" onclick="selectPay(this,'카카오페이')">
      🟨 카카오페이
    </button>

    <button class="pay-chip" onclick="selectPay(this,'토스')">
      💙 토스
    </button>
  </div>

  <input
    id="paymentInput"
    class="pay-hidden-input"
    value="은행이체"
  />
</div>

<style>
.quick-pay-wrap{
  margin-top:14px;
}

.quick-title{
  font-size:14px;
  font-weight:700;
  margin-bottom:10px;
  color:#ffffff;
}

.quick-pay-grid{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.pay-chip{
  border:none;
  background:#111827;
  color:#cbd5e1;
  padding:12px 16px;
  border-radius:14px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:0.2s;
  border:1px solid #263244;
}

.pay-chip:hover{
  transform:translateY(-2px);
}

.pay-chip.active{
  background:linear-gradient(135deg,#2563eb,#3b82f6);
  color:white;
  border:1px solid #3b82f6;
  box-shadow:0 0 20px rgba(37,99,235,0.35);
}

.pay-hidden-input{
  opacity:0;
  height:0;
  width:0;
  position:absolute;
}

@media(max-width:520px){
  .quick-pay-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .pay-chip{
    width:100%;
  }
}
</style>

<script>
function selectPay(el,value){

  document.querySelectorAll('.pay-chip')
    .forEach(btn=>btn.classList.remove('active'));

  el.classList.add('active');

  document.getElementById('paymentInput').value=value;

  console.log('선택 결제방법:',value);
}
</script>
