uted)}.bottomNav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;background:rgba(8,17,31,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:80}.navItem{background:transparent;color:#94a3b8;padding:8px 2px;border-radius:14px;font-size:11px;font-weight:900}.navItem b{display:block;font-size:20px;margin-bottom:3px}.navItem.active{color:white;background:#172033}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;z-index:100}.modal.show{display:flex}.sheet{width:100%;max-width:520px;margin:0 auto;background:#0b1220;border:1px solid var(--line);border-radius:28px 28px 0 0;padding:20px;max-height:90vh;overflow:auto}.sheetHandle{width:46px;height:5px;background:#334155;border-radius:99px;margin:0 auto 14px}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:95px;max-width:480px;width:calc(100% - 32px);background:#111827;border:1px solid var(--line);color:white;border-radius:18px;padding:13px;display:none;z-index:120;box-shadow:0 20px 45px rgba(0,0,0,.4)}.toast.show{display:block}.refTree{background:#020617;border:1px solid var(--line);border-radius:18px;padding:14px;font-family:monospace;color:#cbd5e1;white-space:pre;overflow:auto}.alert{padding:12px;border-radius:18px;background:#172033;border:1px solid var(--line);margin-bottom:8px;font-size:13px}.pcHint{display:none}@media(min-width:900px){body{background:#030712}.app{max-width:1180px;padding-bottom:0}.bottomNav{display:none}.pcHint{display:block}.topbar{border-radius:0 0 22px 22px}.desktopGrid{display:grid;grid-template-columns:320px 1fr;gap:18px;padding:0 16px}.page{padding-bottom:30px}.desktopSide{display:block}.quickStats{grid-template-columns:repeat(6,1fr)}.sellerList{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.sellerCard{margin-bottom:0}.adminPanel{grid-template-columns:repeat(4,1fr)}}

<body>
<div class="app">
  <header class="topbar">
    <div class="toprow">
      <div class="brand"><div class="brandIcon">₮</div><div>TetherGet<br><span class="sub">P2P Escrow Mobile</span></div></div>
      <button class="wallet" id="walletBtn" onclick="connectWallet()">지갑 연결</button>
    </div>
    <div class="search"><input id="search" placeholder="판매자, 통화, 결제방법 검색" oninput="render()"><button class="filterBtn" onclick="toast('고급 필터는 다음 버전에서 확장됩니다')">필터</button></div>
  </header>

  <section class="hero">
    <h1>USDT/SOL P2P 거래를 더 안전하게</h1>
    <p>에스크로, 입금확인, 평판, 레벨, 분쟁중재, 20단계 레퍼럴을 모바일 앱처럼 관리합니다.</p>
  </section>

  <section class="quickStats" id="quickStats"></section>

  <section class="chips">
    <button class="chip active" onclick="setCoin('ALL',this)">전체</button>
    <button class="chip" onclick="setCoin('USDT',this)">USDT</button>
    <button class="chip" onclick="setCoin('SOL',this)">SOL</button>
    <button class="chip" onclick="setFiat('KRW',this)">KRW</button>
    <button class="chip" onclick="setFiat('VND',this)">VND</button>
    <button class="chip" onclick="setFiat('USD',this)">USD</button>
  </section>

  <main>
    <section id="home" class="page active">
      <div class="sectionTitle"><h2>인증 판매자</h2><small id="sellerCount"></small></div>
      <div class="sellerList" id="sellerList"></div>
    </section>

    <section id="sell" class="page">
      <div class="sectionTitle"><h2>판매 등록</h2><small>에스크로 예치형</small></div>
      <div class="card form">
        <label>판매 코인</label><select id="sellCoin"><option>USDT</option><option>SOL</option></select>
        <label>판매 수량</label><input id="sellAmount" type="number" placeholder="예: 1000">
        <label>받을 통화</label><select id="sellFiat"><option>KRW</option><option>VND</option><option>USD</option><option>THB</option></select>
        <label>환율</label><input id="sellRate" type="number" placeholder="예: 1380">
        <label>결제방법</label><input id="sellPayment" placeholder="은행이체 / MoMo / 현금">
        <label>거래 메모</label><textarea id="sellMemo" placeholder="입금 확인 시간, 주의사항"></textarea>
        <button class="sellBtn" onclick="createListing()">판매글 등록 + 에스크로 예치</button>
      </div>
    </section>

    <section id="orders" class="page">
      <div class="sectionTitle"><h2>내 거래</h2><small>진행 상태</small></div>
      <div id="orderList"></div>
    </section>

    <section id="wallet" class="page">
      <div class="sectionTitle"><h2>내 지갑/평판</h2><small>레벨 시스템</small></div>
      <div class="card" id="walletInfo"></div>
      <div class="card"><h2>20단계 레퍼럴</h2><div class="refTree" id="refTree"></div></div>
    </section>

    <section id="admin" class="page">
      <div class="sectionTitle"><h2>관리자 콘솔</h2><small>운영 백오피스</small></div>
      <div class="adminPanel" id="adminMetrics"></div>
      <div class="card tableCard"><h2>거래 관리</h2><table class="miniTable" id="adminTrades"></table></div>
      <div class="card tableCard"><h2>유저/판매자 관리</h2><table class="miniTable" id="adminUsers"></table></div>
      <div class="card"><h2>알림 센터</h2><div id="alerts"></div></div>
    </section>
  </main>

  <nav class="bottomNav">
    <button class="navItem active" onclick="go('home',this)"><b>🏠</b>홈</button>
    <button class="navItem" onclick="go('sell',this)"><b>＋</b>판매</button>
    <button class="navItem" onclick="go('orders',this)"><b>📄</b>거래</button>
    <button class="navItem" onclick="go('wallet',this)"><b>👛</b>지갑</button>
    <button class="navItem" onclick="go('admin',this)"><b>⚙️</b>관리</button>
  </nav>
</div>

<div class="modal" id="buyModal"><div class="sheet"><div class="sheetHandle"></div><div id="buySheet"></div></div></div>
<div class="toast" id="toast"></div>

<script>
let wallet=''; let coinFilter='ALL'; let fiatFilter='ALL';
let sellers=[
{id:1,name:'AlphaPay',avatar:'A',level:7,verified:true,score:99,done:428,avg:'2분',coin:'USDT',amount:50000,fiat:'KRW',rate:1384,pay:['은행이체','카카오뱅크','토스'],limit:'100~20,000 USDT',memo:'대량 거래 가능 / 빠른 확인'},
{id:2,name:'Danang OTC',avatar:'D',level:6,verified:true,score:97,done:311,avg:'4분',coin:'USDT',amount:28000,fiat:'VND',rate:25500,pay:['베트남 계좌','MoMo','현금'],limit:'50~10,000 USDT',memo:'다낭/호치민 가능'},
{id:3,name:'SOL Master',avatar:'S',level:5,verified:true,score:96,done:188,avg:'3분',coin:'SOL',amount:1200,fiat:'KRW',rate:205000,pay:['은행이체'],limit:'1~200 SOL',memo:'SOL 즉시 릴리즈'},
{id:4,name:'Global Desk',avatar:'G',level:8,verified:true,score:98,done:760,avg:'5분',coin:'USDT',amount:90000,fiat:'USD',rate:1,pay:['Wise','현금','은행'],limit:'500~50,000 USDT',memo:'글로벌 대량 OTC'},
{id:5,name:'Fast VN',avatar:'V',level:4,verified:false,score:91,done:84,avg:'7분',coin:'USDT',amount:9000,fiat:'VND',rate:25480,pay:['MoMo','은행'],limit:'20~3,000 USDT',memo:'소액 빠른 거래'},
{id:6,name:'Korea Block',avatar:'K',level:6,verified:true,score:95,done:244,avg:'6분',coin:'SOL',amount:650,fiat:'KRW',rate:204500,pay:['신한','하나','우리'],limit:'1~100 SOL',memo:'평판 우수 판매자'}
];
let orders=[
{id:1001,seller:'AlphaPay',buyer:'TG_USER_001',coin:'USDT',amount:1000,fiat:'KRW',rate:1384,status:'WAIT',proof:'',created:'오늘 11:30'},
{id:1002,seller:'Global Desk',buyer:'TG_USER_002',coin:'USDT',amount:5000,fiat:'USD',rate:1,status:'PAID',proof:'wire-proof.png',created:'오늘 11:52'},
{id:1003,seller:'Danang OTC',buyer:'TG_USER_003',coin:'USDT',amount:700,fiat:'VND',rate:25500,status:'DISPUTE',proof:'momo-proof.jpg',created:'어제 21:10'}
];
let users=[
{id:'U001',name:'AlphaPay',role:'판매자',level:7,score:99,volume:588000000,downline:41,status:'정상'},
{id:'U002',name:'Danang OTC',role:'판매자',level:6,score:97,volume:321000000,downline:25,status:'정상'},
{id:'U003',name:'RiskUser',role:'구매자',level:1,score:32,volume:4000000,downline:0,status:'정지'},
{id:'U004',name:'ReferralKing',role:'파트너',level:9,score:98,volume:890000000,downline:318,status:'VIP'}
];
let alerts=['입금 확인 요청: #1002 Global Desk','분쟁 접수: #1003 Danang OTC','신규 판매자 승인 대기: Fast VN'];
function n(x){return Number(x||0).toLocaleString()} function totalVolume(){return sellers.reduce((a,s)=>a+s.amount*s.rate,0)}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function connectWallet(){wallet='TG_'+Math.floor(Math.random()*999999);document.getElementById('walletBtn').textContent=wallet.slice(0,5)+'...'+wallet.slice(-4);toast('지갑이 연결되었습니다')}
function go(id,el){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.navItem').forEach(b=>b.classList.remove('active')); if(el)el.classList.add('active');render()}
function setCoin(v,el){coinFilter=v;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');render()} function setFiat(v,el){fiatFilter=v;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');render()}
function filteredSellers(){let q=(document.getElementById('search')?.value||'').toLowerCase();return sellers.filter(s=>(coinFilter==='ALL'||s.coin===coinFilter)&&(fiatFilter==='ALL'||s.fiat===fiatFilter)&&(`${s.name} ${s.fiat} ${s.coin} ${s.pay.join(' ')}`.toLowerCase().includes(q)))}
function sellerCard(s){return `<div class="sellerCard"><div class="sellerTop"><div class="sellerInfo"><div class="avatar">${s.avatar}</div><div><div class="name">${s.name} ${s.verified?'✅':''}</div><div class="sub">Lv.${s.level} · 완료 ${s.done}건 · 평점 ${s.score}%</div></div></div><span class="badge green">응답 ${s.avg}</span></div><div class="priceBox"><div class="priceItem"><span>판매 가능</span><b>${n(s.amount)} ${s.coin}</b></div><div class="priceItem"><span>환율</span><b>${n(s.rate)} ${s.fiat}</b></div></div><div class="methods">${s.pay.map(p=>`<span class="method">${p}</span>`).join('')}</div><div class="sub" style="margin-top:10px">한도: ${s.limit}<br>${s.memo}</div><button class="buyBtn" onclick="openBuy(${s.id})">${s.coin} 구매하기</button></div>`}
function openBuy(id){let s=sellers.find(x=>x.id===id);document.getElementById('buySheet').innerHTML=`<h2>${s.name}에게 ${s.coin} 구매</h2><div class="steps"><div class="step on"><div class="dot">1</div><span>신청</span></div><div class="step"><div class="dot">2</div><span>입금</span></div><div class="step"><div class="dot">3</div><span>확인</span></div><div class="step"><div class="dot">4</div><span>지급</span></div></div><div class="card form"><label>구매 수량</label><input id="buyAmount" type="number" placeholder="예: 1000"><label>결제방법</label><select id="buyPay">${s.pay.map(p=>`<option>${p}</option>`).join('')}</select><div class="priceBox"><div class="priceItem"><span>환율</span><b>${n(s.rate)} ${s.fiat}</b></div><div class="priceItem"><span>예상 수수료</span><b>1%</b></div></div><button class="buyBtn" onclick="confirmBuy(${s.id})">거래 신청하기</button><button class="buyBtn secondaryBtn" onclick="closeBuy()">닫기</button></div>`;document.getElementById('buyModal').classList.add('show')}
function closeBuy(){document.getElementById('buyModal').classList.remove('show')}
function confirmBuy(id){let s=sellers.find(x=>x.id===id), amt=+document.getElementById('buyAmount').value;if(!amt){toast('구매 수량을 입력하세요');return}orders.unshift({id:Date.now(),seller:s.name,buyer:wallet||'TG_DEMO',coin:s.coin,amount:amt,fiat:s.fiat,rate:s.rate,status:'WAIT',proof:'',created:'방금'});alerts.unshift(`신규 거래 신청: ${s.name} ${amt} ${s.coin}`);closeBuy();go('orders',document.querySelectorAll('.navItem')[2]);toast('거래 신청 완료')}
function createListing(){let coin=document.getElementById('sellCoin').value, amount=+document.getElementById('sellAmount').value, fiat=document.getElementById('sellFiat').value, rate=+document.getElementById('sellRate').value, pay=document.getElementById('sellPayment').value;if(!amount||!rate||!pay){toast('필수값을 입력하세요');return}sellers.unshift({id:Date.now(),name:wallet||'New Seller',avatar:'N',level:1,verified:false,score:80,done:0,avg:'미측정',coin,amount,fiat,rate,pay:[pay],limit:'직접 설정',memo:document.getElementById('sellMemo').value||'신규 판매글'});alerts.unshift('신규 판매글 등록 승인 대기');toast('판매글이 등록되었습니다');go('home',document.querySelectorAll('.navItem')[0])}
function markPaid(id){orders=orders.map(o=>o.id===id?{...o,status:'PAID',proof:'proof-uploaded.png'}:o);alerts.unshift('입금 확인 바람: #'+id);toast('판매자에게 입금확인 알림 발송')} function release(id){orders=orders.map(o=>o.id===id?{...o,status:'DONE'}:o);toast('코인 지급 완료 처리')} function dispute(id){orders=orders.map(o=>o.id===id?{...o,status:'DISPUTE'}:o);alerts.unshift('분쟁 접수: #'+id);toast('분쟁이 접수되었습니다')}
function orderCard(o){let cls=o.status==='PAID'?'paid':o.status==='DONE'?'done':o.status==='DISPUTE'?'dispute':'wait';let text={WAIT:'입금대기',PAID:'입금확인요청',DONE:'지급완료',DISPUTE:'분쟁'}[o.status];return `<div class="order"><div class="orderTop"><div><div class="amount">${n(o.amount)} ${o.coin}</div><div class="sub">${o.seller} · ${o.created}</div></div><span class="status ${cls}">${text}</span></div><div class="priceBox"><div class="priceItem"><span>총액</span><b>${n(o.amount*o.rate)} ${o.fiat}</b></div><div class="priceItem"><span>증빙</span><b>${o.proof||'없음'}</b></div></div><div class="methods"><button class="method" onclick="markPaid(${o.id})">입금완료</button><button class="method" onclick="release(${o.id})">릴리즈</button><button class="method" onclick="dispute(${o.id})">분쟁</button></div></div>`}
function render(){document.getElementById('quickStats').innerHTML=`<div class="qstat"><span>판매자</span><b>${sellers.length}</b></div><div class="qstat"><span>거래</span><b>${orders.length}</b></div><div class="qstat"><span>거래량</span><b>${Math.round(totalVolume()/1000000)}M</b></div><div class="qstat"><span>분쟁</span><b>${orders.filter(o=>o.status==='DISPUTE').length}</b></div>`;let fs=filteredSellers();document.getElementById('sellerCount').textContent=fs.length+'명';document.getElementById('sellerList').innerHTML=fs.map(sellerCard).join('')||'<div class="card">검색 결과가 없습니다.</div>';document.getElementById('orderList').innerHTML=orders.map(orderCard).join('');document.getElementById('walletInfo').innerHTML=`<h2>${wallet||'지갑 미연결'}</h2><p class="sub">레벨 3 · 평판 94% · 완료거래 18건</p><div class="priceBox"><div class="priceItem"><span>예상 USDT</span><b>12,450</b></div><div class="priceItem"><span>레퍼럴 수익</span><b>840 USDT</b></div></div><button class="sellBtn" onclick="connectWallet()">지갑 연결/갱신</button>`;document.getElementById('refTree').textContent=`ReferralKing\n└─ AlphaPay / 41명 / 588M\n  └─ SubSeller A / 12명\n    └─ Buyer Group 1 / 84명\n└─ Danang OTC / 25명 / 321M\n  └─ VN Partner / 33명`;document.getElementById('adminMetrics').innerHTML=`<div class="adminMetric"><span>총 거래량</span><b>${n(totalVolume())}</b></div><div class="adminMetric"><span>수수료 예상</span><b>${n(totalVolume()*0.02)}</b></div><div class="adminMetric"><span>입금확인</span><b>${orders.filter(o=>o.status==='PAID').length}</b></div><div class="adminMetric"><span>분쟁</span><b>${orders.filter(o=>o.status==='DISPUTE').length}</b></div>`;document.getElementById('adminTrades').innerHTML='<tr><th>ID</th><th>판매자</th><th>구매자</th><th>수량</th><th>총액</th><th>상태</th></tr>'+orders.map(o=>`<tr><td>${o.id}</td><td>${o.seller}</td><td>${o.buyer}</td><td>${n(o.amount)} ${o.coin}</td><td>${n(o.amount*o.rate)} ${o.fiat}</td><td>${o.status}</td></tr>`).join('');document.getElementById('adminUsers').innerHTML='<tr><th>ID</th><th>이름</th><th>역할</th><th>레벨</th><th>점수</th><th>거래량</th><th>하부</th><th>상태</th></tr>'+users.map(u=>`<tr><td>${u.id}</td><td>${u.name}</td><td>${u.role}</td><td>${u.level}</td><td>${u.score}</td><td>${n(u.volume)}</td><td>${u.downline}</td><td>${u.status}</td></tr>`).join('');document.getElementById('alerts').innerHTML=alerts.map(a=>`<div class="alert">🔔 ${a}</div>`).join('')}
document.getElementById('buyModal').addEventListener('click',e=>{if(e.target.id==='buyModal')closeBuy()});render();
</script>
</body>
</html>
